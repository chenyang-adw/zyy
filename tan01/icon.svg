<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="17" cy="15" r="9" fill="#ffffff" opacity=".10"/>
  <circle cx="52" cy="52" r="11" fill="#ffffff" opacity=".07"/>

  <!-- 小星星点缀 -->
  <g fill="#ffffff" opacity=".85">
    <path d="M12 33.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/>
    <path d="M52.5 27.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" opacity=".75"/>
  </g>

  <!-- 身体：S 形卷曲（先描边再加一层提亮） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 52c9.5 0 12-4.5 12-9s-4-7.5-4-11.5S27 24 33 24" stroke="#065f46" stroke-width="9.6" opacity=".55"/>
    <path d="M15 52c9.5 0 12-4.5 12-9s-4-7.5-4-11.5S27 24 33 24" stroke="url(#skin2)" stroke-width="7.6"/>
    <path d="M15 52c9.5 0 12-4.5 12-9" stroke="#ffffff" stroke-width="1.5" opacity=".35"/>
  </g>
  <circle cx="15" cy="52" r="3.4" fill="#22c55e"/>

  <!-- 头部 -->
  <g>
    <circle cx="41" cy="23" r="13.2" fill="#065f46" opacity=".5"/>
    <circle cx="41" cy="23" r="12.4" fill="url(#skin)"/>
    <!-- 头顶小鳞片 -->
    <g fill="#ffffff" opacity=".35">
      <circle cx="36.5" cy="13.2" r="1.5"/>
      <circle cx="41" cy="12.2" r="1.7"/>
      <circle cx="45.5" cy="13.2" r="1.5"/>
    </g>

    <!-- 大眼睛（二次元：大眼 + 高光） -->
    <ellipse cx="36.6" cy="21.4" rx="4.1" ry="4.9" fill="#0b1220"/>
    <ellipse cx="45.4" cy="21.4" rx="4.1" ry="4.9" fill="#0b1220"/>
    <ellipse cx="36.6" cy="22.4" rx="2.9" ry="3.5" fill="#22c55e" opacity=".55"/>
    <ellipse cx="45.4" cy="22.4" rx="2.9" ry="3.5" fill="#22c55e" opacity=".55"/>
    <circle cx="35.2" cy="19.3" r="1.55" fill="#ffffff"/>
    <circle cx="44" cy="19.3" r="1.55" fill="#ffffff"/>
    <circle cx="38" cy="24" r=".85" fill="#ffffff" opacity=".75"/>
    <circle cx="46.8" cy="24" r=".85" fill="#ffffff" opacity=".75"/>

    <!-- 腮红 -->
    <ellipse cx="32.4" cy="26.6" rx="2.7" ry="1.7" fill="#fb7185" opacity=".6"/>
    <ellipse cx="49.6" cy="26.6" rx="2.7" ry="1.7" fill="#fb7185" opacity=".6"/>

    <!-- 小嘴 + 吐信子 -->
    <path d="M39.4 29.4c.9 1.1 2.3 1.1 3.2 0" fill="none" stroke="#065f46" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M41 30.6v2.1" stroke="#f43f5e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M41 32.7l-1.7 1.5M41 32.7l1.7 1.5" stroke="#f43f5e" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
