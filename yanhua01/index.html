<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烟火向星辰</title>
<meta name="description" content="输入一句话，让烟花、爱心和代码雨替你说出来。">
<meta name="theme-color" content="#08070f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #08070f;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #ffe9f2;
  }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
  /* 花瓣专用上层画布：不参与主画布的拖尾，所以花瓣是清晰的 */
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }

  /* ---------- 输入弹窗 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
    background: radial-gradient(70% 60% at 50% 40%, rgba(60, 20, 60, .55), rgba(6, 5, 12, .92));
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: opacity .5s ease, visibility .5s ease;
  }
  .modal[hidden] { display: none; }
  .modal.out { opacity: 0; visibility: hidden; }

  .card {
    width: 100%; max-width: 360px;
    padding: 26px 22px 22px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(160deg, rgba(46, 20, 46, .96), rgba(20, 12, 30, .98));
    border: 1px solid rgba(255, 150, 190, .28);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 40px rgba(255, 105, 180, .18) inset;
    animation: pop .4s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  @keyframes pop { from { transform: scale(.86) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  .card .ico { font-size: 40px; line-height: 1; filter: drop-shadow(0 0 14px rgba(255, 105, 180, .8)); }
  .card h1 { margin: 10px 0 6px; font-size: 19px; letter-spacing: .02em; }
  .card p { margin: 0 0 18px; font-size: 12.5px; color: rgba(255, 209, 226, .62); line-height: 1.7; }

  .card input {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; margin-bottom: 14px;
    font-family: inherit; font-size: 15px;
    color: #fff6fa;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 150, 190, .32);
    border-radius: 12px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card input::placeholder { color: rgba(255, 200, 220, .42); }
  .card input:focus { border-color: #ff69b4; box-shadow: 0 0 0 3px rgba(255, 105, 180, .18); }

  .card button {
    width: 100%; padding: 12px 18px;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: #fff; cursor: pointer;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff69b4, #ba55d3);
    box-shadow: 0 10px 26px rgba(255, 105, 180, .35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .card button:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(255, 105, 180, .45); }
  .card button.ghost {
    margin-top: 8px; color: rgba(255, 209, 226, .62);
    background: transparent; box-shadow: none; font-weight: 400; font-size: 13px;
  }
  .card .tip { margin: 12px 0 0; font-size: 11.5px; color: rgba(255, 200, 220, .38); }

  /* ---------- 弹出的那句话 ---------- */
  .love {
    position: fixed; left: 50%; top: 50%; z-index: 10;
    transform: translate(-50%, -50%) scale(.5);
    margin: 0; padding: 0 16px;
    width: max-content; max-width: 92vw;
    text-align: center;
    font-size: clamp(22px, 5.2vw, 46px);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.4;
    background: linear-gradient(180deg, #ffffff, #ffd9e8 55%, #ff9ecb);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #fff;
    /* 用滤镜描边（text-shadow 会从透明字里透出来，把字变灰） */
    filter:
      drop-shadow(0 2px 5px rgba(15, 0, 15, .95))
      drop-shadow(0 0 14px rgba(255, 105, 180, .95))
      drop-shadow(0 0 38px rgba(186, 85, 211, .8));
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease, transform .8s cubic-bezier(.2, 1.3, .4, 1);
  }
  .love.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 11.5px; color: rgba(255, 180, 210, .42);
    pointer-events: none; user-select: none; white-space: nowrap;
    opacity: 0; transition: opacity 1s ease;
  }
  .hint.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="fx"></canvas>

<h1 class="love" id="love"></h1>
<p class="hint" id="hint">点击任意位置 → 撒一把花瓣 + 放一朵烟花</p>

<!-- 开始前的输入弹窗 -->
<div class="modal" id="modal">
  <div class="card">
    <div class="ico">🎆</div>
    <h1>写下你想说的话</h1>
    <p>烟花、爱心和代码雨会替你把它送到天上</p>
    <input id="msg" maxlength="18" placeholder="烟火向星辰，所愿皆成真" autocomplete="off">
    <button type="button" id="go">开始</button>
    <button type="button" class="ghost" id="skip">先看看效果</button>
    <p class="tip">最多 18 个字 · 留空就用默认那句</p>
  </div>
</div>

<script src="show.js"></script>
</body>
</html>
