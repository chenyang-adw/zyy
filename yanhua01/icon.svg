    <circle cx="43" cy="14" r="1.5"/>
    <circle cx="48" cy="25" r="1.5"/>
    <circle cx="43" cy="36" r="1.5"/>
    <circle cx="32" cy="41" r="1.5"/>
    <circle cx="21" cy="36" r="1.5"/>
    <circle cx="16" cy="25" r="1.5"/>
