<body>

<header class="hero night">
  <canvas class="hero-stars" aria-hidden="true"></canvas>
  <canvas class="hero-fx" aria-hidden="true"></canvas>
  <div class="hero-inner">
    <div class="avatar" id="avatar"></div>
    <div class="hero-info">
      <h1 id="hero-name"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <nav class="contacts" id="contacts"></nav>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="search" type="search" placeholder="搜索站点名称或简介…" autocomplete="off" aria-label="搜索站点">
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>没有匹配的站点</p>
</main>

<footer>
  <p class="stats" id="stats"></p>
  <p class="copyright" id="copyright"></p>
  <p class="nav" id="nav"></p>
  <p class="site-note" style="margin:6px 0 0;font-size:12px;opacity:.6">本站仅用于学习交流与案例展示，不作任何商业用途</p>
</footer>
