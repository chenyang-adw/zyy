<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>深海潜水艇</title>
<meta name="description" content="拖动潜艇在深海隧道里左右闪避，捡激光打沉敌舰、捡时钟放慢世界，越走越快。">
<meta name="theme-color" content="#06302f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <h1>深海潜水艇</h1>
    <div class="stats">
      <div class="stat"><span class="k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="k">最高</span><b id="best">0</b></div>
      <div class="stat"><span class="k">速度</span><b id="speed">1.0</b></div>
      <button class="btn icon" id="btnSound" title="音效开关">🔊</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" aria-label="潜水艇游戏区"></canvas>

    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">潜艇沉了</h2>
        <p class="tip" id="overTip">拖动潜艇躲开敌舰</p>
        <div class="scores">
          <div class="srow"><span>本次分数</span><b id="finalScore">0</b></div>
          <div class="srow"><span>历史最高</span><b id="finalBest">0</b></div>
        </div>
        <button class="btn primary" id="btnAgain">再来一次</button>
      </div>
    </div>
  </main>

  <footer class="tools">
    <span class="hintline" id="hintline">拖动潜艇躲开敌舰 · 绿色捡激光 / 蓝色捡减速 · 双指可开传送门</span>
    <button class="btn" id="btnRestart">重来</button>
  </footer>

  <p class="site-note" style="margin:0;font-size:11px;line-height:1.4;opacity:.55;text-align:center">本站仅用于学习交流 · 案例展示</p>

</div>

<script src="game.js"></script>
</body>
</html>
