<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eefb"/>
      <stop offset="1" stop-color="#ecdff2"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e4f0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcadd"/>
      <stop offset="1" stop-color="#b3adc7"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a49dbb"/>
      <stop offset="1" stop-color="#8d86a6"/>
    </linearGradient>
    <radialGradient id="body" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#4a4570"/>
      <stop offset="1" stop-color="#241f3f"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 影子 -->
  <ellipse cx="256" cy="404" rx="150" ry="42" fill="#b9b1cf" opacity=".38"/>

  <!-- 等距方块 -->
  <g>
    <path d="M256 190 L394 258 L256 326 L118 258 Z" fill="url(#top)"/>
    <path d="M118 258 L256 326 L256 400 L118 332 Z" fill="url(#left)"/>
    <path d="M394 258 L256 326 L256 400 L394 332 Z" fill="url(#right)"/>
    <path d="M256 190 L394 258 L256 326 L118 258 Z" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
  </g>

  <!-- 角色 -->
  <g transform="translate(256 268)">
    <ellipse cx="0" cy="-64" rx="34" ry="32" fill="url(#body)"/>
    <path d="M-34 -46 q34 -18 68 0 q10 34 6 62 q-4 22 -40 22 q-36 0 -40 -22 q-4 -28 6 -62z" fill="url(#body)"/>
    <ellipse cx="-11" cy="-72" rx="9" ry="7" fill="#ffffff" opacity=".22"/>
  </g>
</svg>
