<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a1f"/>
      <stop offset="0.45" stop-color="#6b4423"/>
      <stop offset="1" stop-color="#4a2c13"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed321"/>
      <stop offset="1" stop-color="#4f9e12"/>
    </linearGradient>
    <radialGradient id="gold" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="0.5" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#e09b12"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#soil)"/>

  <!-- 草地 -->
  <path d="M0 100 q60 -18 128 -6 q80 14 160 2 q90 -14 160 4 q36 8 64 6 V0 H0 Z" fill="url(#grass)"/>
  <g fill="#5aa814">
    <path d="M0 96 q40 -10 80 -2 q60 12 120 2 q70 -12 130 2 q60 12 120 0 V96 H0Z"/>
  </g>

  <!-- 泥土斑点 -->
  <g fill="#e2c48a" opacity=".55">
    <ellipse cx="90" cy="200" rx="16" ry="7" transform="rotate(24 90 200)"/>
    <ellipse cx="410" cy="250" rx="14" ry="6" transform="rotate(-18 410 250)"/>
    <ellipse cx="140" cy="400" rx="12" ry="5" transform="rotate(12 140 400)"/>
    <ellipse cx="380" cy="430" rx="15" ry="6" transform="rotate(-26 380 430)"/>
  </g>

  <!-- 绳 + 钩爪 -->
  <path d="M256 62 V300" stroke="#1d1410" stroke-width="12" stroke-linecap="round"/>
  <g fill="#1d1410">
    <rect x="232" y="286" width="48" height="26" rx="6"/>
    <path d="M232 312 q-42 10 -56 52 q-8 26 -2 56 q22 -34 54 -46 q22 -8 24 -30 z"/>
    <path d="M280 312 q42 10 56 52 q8 26 2 56 q-22 -34 -54 -46 q-22 -8 -24 -30 z"/>
    <circle cx="238" cy="330" r="7" fill="#3a2a1c"/>
    <circle cx="274" cy="330" r="7" fill="#3a2a1c"/>
  </g>

  <!-- 金块 -->
  <g>
    <path d="M256 424 L300 350 q22 6 34 24 q22 34 -6 62 q-24 26 -62 22 q-42 -4 -56 -34 q-12 -26 6 -48 q14 -18 40 -20 z" fill="url(#gold)" stroke="#b87d0c" stroke-width="9" stroke-linejoin="round"/>
    <path d="M214 396 q26 -22 62 -12" fill="none" stroke="#fff3a8" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
