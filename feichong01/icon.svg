  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="120" cy="128" r="62" fill="#ffffff" opacity=".16"/>
  <circle cx="412" cy="376" r="48" fill="#ffffff" opacity=".12"/>

