<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一飞冲天</title>
<meta name="description" content="点一下往上飞，穿过旋转的圆环：彩色实心段会撞死你，玻璃段能撞碎加分。">
<meta name="theme-color" content="#f30e98">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="logo" aria-label="一飞冲天"></div>
    <div class="stats">
      <div class="stat"><span class="k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="k">最高</span><b id="best">0</b></div>
      <button class="btn icon" id="btnSound" title="音效开关">🔊</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" aria-label="一飞冲天游戏区"></canvas>

    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">撞上去了</h2>
        <p class="tip" id="overTip">彩色实心段碰不得，玻璃段可以撞碎</p>
        <div class="scores">
          <div class="srow"><span>本次分数</span><b id="finalScore">0</b></div>
          <div class="srow"><span>历史最高</span><b id="finalBest">0</b></div>
        </div>
        <div class="btnrow">
          <button class="btn primary" id="btnAgain">再来一次</button>
          <button class="btn" id="btnRevive">免费复活（1次）</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="tools">
    <span class="hintline" id="hintline">戳屏幕往上飞 · 找圆环的玻璃段过</span>
    <button class="btn" id="btnBall">换球</button>
  </footer>

</div>

<script src="game.js"></script>
</body>
</html>
